name: Crowdin Localization Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - BitwardenForCommandPalette/Strings/en-US/Resources.resw
      - crowdin.yml

jobs:
  upload-sources:
    name: Upload source strings to Crowdin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload sources to Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          crowdin_branch_name: main
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    name: Download translated strings from Crowdin
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          export_only_approved: true
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Create Pull Request with updated translations
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(i18n): sync translations from Crowdin"
          title: "chore(i18n): sync translations from Crowdin"
          body: |
            Automated translation sync from Crowdin.

            ## Notes
            - This PR is generated by `.github/workflows/crowdin-sync.yml`.
            - Only approved translations are downloaded.
          branch: "chore/crowdin-translation-sync"
          delete-branch: true
