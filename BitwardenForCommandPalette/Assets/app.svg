<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变和滤镜 -->
  <defs>
    <linearGradient id="ringGradient" x1="140" y1="140" x2="884" y2="884" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    
    <linearGradient id="shieldGradient" x1="300" y1="300" x2="724" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="512" cy="512" r="480" fill="#0F172A" />
  
  <!-- 外环渐变 -->
  <circle cx="512" cy="512" r="460" stroke="url(#ringGradient)" stroke-width="40" stroke-linecap="round" />

  <!-- 内部背景装饰（暗示列表/命令面板） -->
  <rect x="300" y="320" width="424" height="24" rx="12" fill="#1E293B" />
  <rect x="300" y="380" width="300" height="24" rx="12" fill="#1E293B" />
  <rect x="300" y="620" width="424" height="24" rx="12" fill="#1E293B" opacity="0.5" />
  <rect x="300" y="680" width="200" height="24" rx="12" fill="#1E293B" opacity="0.3" />

  <!-- 核心锁图标 -->
  <g filter="url(#softShadow)">
    <!-- 锁钩 -->
    <path d="M380 480V380C380 307.102 439.102 248 512 248C584.898 248 644 307.102 644 380V480" 
          stroke="#94A3B8" stroke-width="48" stroke-linecap="round" />
    <!-- 锁身 -->
    <rect x="340" y="460" width="344" height="260" rx="40" fill="url(#shieldGradient)" />
    <!-- 锁芯孔 -->
    <circle cx="512" cy="565" r="32" fill="#0F172A" />
    <path d="M512 585V630" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>